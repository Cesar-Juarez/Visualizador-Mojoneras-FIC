
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Mojoneras</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #263445;
        }

        header {
            background: #142d4e;
            color: white;
            padding: 18px 24px;
        }

        header h1 {
            margin: 0;
            font-size: 23px;
        }

        header p {
            margin: 6px 0 0;
            font-size: 13px;
            color: #d8e2ef;
        }

        .contenedor {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 15px;
            padding: 15px;
            height: calc(100vh - 85px);
        }

        .panel {
            background: white;
            border-radius: 9px;
            padding: 15px;
            overflow-y: auto;
            box-shadow: 0 2px 8px #00000012;
        }

        .panel h2 {
            font-size: 17px;
            margin: 0 0 12px;
            color: #142d4e;
        }

        #buscador {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd3dc;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        #lista {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .elemento {
            padding: 10px;
            border: 1px solid #e0e5eb;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            background: white;
        }

        .elemento:hover,
        .elemento.activo {
            background: #eaf1f8;
            border-color: #426b98;
        }

        .informacion {
            margin-top: 20px;
            border-top: 1px solid #e0e5eb;
            padding-top: 15px;
        }

        .informacion h2 {
            margin-bottom: 15px;
        }

        .dato {
            margin-bottom: 12px;
            font-size: 13px;
        }

        .dato strong {
            display: block;
            color: #142d4e;
            margin-bottom: 3px;
        }

        .pdf {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 14px;
            background: #142d4e;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 13px;
        }

        .pdf:hover {
            background: #254b75;
        }

        #mapa {
            height: 100%;
            min-height: 400px;
            border-radius: 9px;
            box-shadow: 0 2px 8px #00000012;
            z-index: 1;
        }

        /* Etiquetas permanentes de las mojoneras */
        .etiqueta-mojonera {
            background: white;
            border: 1px solid #142d4e;
            border-radius: 4px;
            color: #142d4e;
            font-weight: bold;
            font-size: 11px;
            padding: 3px 5px;
            box-shadow: 0 1px 4px #00000040;
        }

        @media (max-width: 750px) {
            .contenedor {
                grid-template-columns: 1fr;
                height: auto;
            }

            .panel {
                max-height: 450px;
            }

            #mapa {
                height: 65vh;
                min-height: 400px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Visualizador de Mojoneras</h1>
    <p>Consulta de ubicación, coordenadas y cédulas de identificación</p>
</header>

<div class="contenedor">

    <aside class="panel">

        <h2>Listado de mojoneras</h2>

        <input
            type="text"
            id="buscador"
            placeholder="Buscar mojonera..."
        >

        <div id="lista"></div>

        <div class="informacion" id="informacion">
            <h2>Información</h2>
            <p>Selecciona una mojonera en el mapa o en el listado.</p>
        </div>

    </aside>

    <div id="mapa"></div>

</div>

<!-- Librerías -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>

    // Crear mapa
    const mapa = L.map('mapa');

    // Mapa base
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(mapa);

    let mojoneras = [];
    let marcadores = [];

    // Cargar archivo CSV
    Papa.parse('Mojoneras_Fic.csv', {
        download: true,
        header: true,
        skipEmptyLines: true,

        complete: function(resultado) {

            mojoneras = resultado.data.filter(m =>
                m.Mojonera &&
                !isNaN(Number(m.Latitud)) &&
                !isNaN(Number(m.Longitud))
            );

            if (mojoneras.length === 0) {
                alert('No se encontraron mojoneras en el archivo CSV.');
                return;
            }

            mostrarLista(mojoneras);
            crearMarcadores();
        },

        error: function() {
            alert('No se pudo cargar Mojoneras_Fic.csv');
        }
    });


    // Crear marcadores y etiquetas
    function crearMarcadores() {

        const grupo = [];

        mojoneras.forEach(m => {

            const lat = Number(m.Latitud);
            const lon = Number(m.Longitud);

            // Conservar el marcador actual
            const marcador = L.marker([lat, lon]).addTo(mapa);

            // Mostrar siempre el nombre de la mojonera
            marcador.bindTooltip(m.Mojonera, {
                permanent: true,
                direction: 'top',
                offset: [0, -10],
                opacity: 1,
                className: 'etiqueta-mojonera'
            });

            marcador.on('click', () => {
                seleccionar(m);
            });

            marcadores.push(marcador);
            grupo.push([lat, lon]);
        });

        // Acercar el mapa a las mojoneras
        if (grupo.length > 0) {
            mapa.fitBounds(grupo, {
                padding: [30, 30],
                maxZoom: 20
            });
        }
    }


    // Mostrar listado
    function mostrarLista(datos) {

        const lista = document.getElementById('lista');

        lista.innerHTML = '';

        datos.forEach(m => {

            const elemento = document.createElement('div');

            elemento.className = 'elemento';
            elemento.textContent = m.Mojonera;

            elemento.addEventListener('click', () => {
                seleccionar(m);
            });

            lista.appendChild(elemento);
        });
    }


    // Seleccionar mojonera
    function seleccionar(m) {

        const lat = Number(m.Latitud);
        const lon = Number(m.Longitud);

        // Acercar al punto seleccionado
        mapa.setView([lat, lon], 20);

        // Mostrar información
        document.getElementById('informacion').innerHTML = `

            <h2>${escaparHTML(m.Mojonera)}</h2>

            <div class="dato">
                <strong>Elevación</strong>
                ${escaparHTML(m.Elevacion)} m
            </div>

            <div class="dato">
                <strong>Coordenadas UTM</strong>
                Este (E): ${escaparHTML(m.E)}<br>
                Norte (N): ${escaparHTML(m.N)}
            </div>

            <div class="dato">
                <strong>Coordenadas topográficas</strong>
                X: ${escaparHTML(m.X)}<br>
                Y: ${escaparHTML(m.Y)}
            </div>

            <div class="dato">
                <strong>Coordenadas geográficas</strong>
                Latitud: ${escaparHTML(m.Latitud)}<br>
                Longitud: ${escaparHTML(m.Longitud)}
            </div>

            <a
                class="pdf"
                href="cedulas/${encodeURIComponent(m.Mojonera)}.pdf"
                target="_blank"
                rel="noopener"
            >
                Abrir cédula PDF
            </a>
        `;

        // Resaltar elemento seleccionado
        document.querySelectorAll('.elemento').forEach(el => {
            el.classList.toggle(
                'activo',
                el.textContent === m.Mojonera
            );
        });
    }


    // Evitar interpretar datos del CSV como HTML
    function escaparHTML(valor) {
        return String(valor ?? '').replace(/[&<>"']/g, caracter => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[caracter]);
    }


    // Buscador
    document.getElementById('buscador').addEventListener('input', function() {

        const texto = this.value.toLowerCase();

        const filtradas = mojoneras.filter(m =>
            m.Mojonera.toLowerCase().includes(texto)
        );

        mostrarLista(filtradas);
    });

</script>

</body>
</html>
